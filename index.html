<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俺の出面 - 子モバイル</title>
    
    <link rel="apple-touch-icon" href="https://i.ibb.co/FL6NqnSf/Gemini-Generated-Image-qj9gexqj9gexqj9g-1.jpg">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/FL6NqnSf/Gemini-Generated-Image-qj9gexqj9gexqj9g-1.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; margin: 0; padding-bottom: 70px; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0; font-size: 20px; }
        .header .current-company { font-size: 14px; font-weight: bold; margin-top: 5px; color: #ffeb3b; }
        .container { padding: 15px; max-width: 450px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input, select, textarea { width: 100%; max-width: 100%; padding: 14px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-bottom: 20px; background: #fafafa; -webkit-appearance: none; appearance: none; }
        input[type="date"] { display: block; height: 54px; }
        button { width: 100%; padding: 16px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-red { background: #e53935; } .btn-gray { background: #757575; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 15px 0; text-align: center; font-size: 12px; font-weight: bold; color: #666; border: none; background: none; }
        .tab-btn.active { color: #1a73e8; border-top: 3px solid #1a73e8; }
        .view { display: none; } .view.active { display: block; }
        .company-item { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .cal-summary { background: #e3f2fd; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; text-align: left; margin-top: 15px; line-height: 1.6; border: 1px solid #90caf9;}
        .user-badge { background: #eee; padding: 10px; border-radius: 6px; font-size: 16px; font-weight: bold; margin-bottom: 20px; color: #555; }
        .wage-highlight { color: #d32f2f; font-size: 18px; font-weight: 900; }
        .period-label { display: inline-block; background: #1a73e8; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 5px; }
        /* 📅 出勤カレンダー */
        .wcal { margin-top: 15px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #fff; }
        .wcal-title { font-weight: bold; font-size: 15px; color: #1a365d; margin-bottom: 8px; }
        .wcal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
        .wcal-wd { text-align: center; font-size: 11px; font-weight: bold; color: #666; padding: 2px 0; }
        .wcal-wd.sun, .wcal-day.sun .wcal-num { color: #d32f2f; }
        .wcal-wd.sat, .wcal-day.sat .wcal-num { color: #1565c0; }
        .wcal-day { box-sizing: border-box; position: relative; aspect-ratio: 1 / 1.05; min-height: 46px; max-width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; background: #fafafa;
            padding: 3px 0 0; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: default; width: 100%; margin: 0; color: #333; font-weight: normal; }
        .wcal-day.empty { border: 0; background: transparent; }
        .wcal-day.in-period { border: 2px solid #f59e0b; }
        .wcal-day.has { cursor: pointer; }
        .wcal-num { font-weight: bold; line-height: 1.2; }
        .wcal-mark { display: block; flex: none; box-sizing: border-box; width: 22px; height: 22px; min-width: 22px; max-width: 22px; min-height: 22px; max-height: 22px; border-radius: 50%; font-size: 10px; line-height: 22px; font-weight: bold; text-align: center; }
        .wcal-mark.full { background: #1a73e8; color: #fff; }
        .wcal-mark.half { background: linear-gradient(90deg, #1a73e8 50%, #d6e4fb 50%); color: #fff; text-shadow: 0 0 2px #1a73e8; }
        .wcal-mark.zero { background: #fff; color: #059669; border: 1px solid #059669; line-height: 20px; }
        .wcal-day.selected { outline: 3px solid #d32f2f; outline-offset: -1px; }
        .wcal-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #555; margin-top: 8px; align-items: center; }
        .wcal-legend span { display: inline-flex; align-items: center; gap: 4px; }
        .wcal-legend .wcal-mark { width: 16px; height: 16px; min-width: 16px; max-width: 16px; min-height: 16px; max-height: 16px; line-height: 16px; font-size: 9px; }
        .wcal-legend .box { width: 14px; height: 14px; border: 2px solid #f59e0b; border-radius: 3px; display: inline-block; }
        .wcal-note { font-size: 12px; color: #92400e; background: #fff7ed; border-radius: 6px; padding: 6px 8px; margin-top: 8px; }
        .wcal-detail { margin-top: 8px; font-size: 13px; background: #f5f9ff; border: 1px solid #cfe0fb; border-radius: 6px; padding: 8px 10px; line-height: 1.6; }
        .wcal-detail:empty { display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>現場革命：俺の出面</h1>
    <div class="current-company" id="headerCompanyName">🏢 送信先未設定</div>
</div>

<div class="container">
    <div id="view-report" class="view active card">
        <div class="user-badge" id="reportUserBadge">👤 報告者: 未設定</div>
        <form id="attendanceForm" onsubmit="submitAttendance(event)">
            <label>作業日</label>
            <input type="date" id="workDate" required>

            <label>現場名</label>
            <select id="siteSelect" onchange="syncClientCompany()" required><option value="" disabled selected>現場を選択してください</option></select>

            <label>応援先社名 (自動反映)</label>
            <input type="text" id="clientCompany" readonly placeholder="自社現場の場合は空欄になります" style="background:#eee; color:#666;">

            <label>人数</label>
            <input type="number" id="headcount" value="1" min="0" step="0.5" required style="font-weight:bold; color:#1a73e8;">

            <div style="margin-bottom: 20px; background: #fff3cd; padding: 12px; border-radius: 8px; border: 1px solid #ffeeba;">
                <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 0; cursor: pointer; color: #856404; font-weight: bold; font-size: 14px; -webkit-user-select: none; user-select: none;">
                    <input type="checkbox" id="halfDayCheck" style="width: 24px; height: 24px; margin-bottom: 0; cursor: pointer; -webkit-appearance: checkbox !important; appearance: checkbox !important; accent-color: #d32f2f;">
                    <span>⚠️ 今回の出面を「半日（人工半分）」にする</span>
                </label>
            </div>

            <label>応援・その他</label>
            <textarea id="others" rows="3" placeholder="備考や応援者名など"></textarea>
            
            <div style="border-top: 2px dashed #ccc; padding-top: 20px; margin-bottom: 20px;">
                <h3 style="margin-top: 0; color: #d32f2f; font-size: 16px;">💰 経費の同時入力</h3>
                <p style="font-size:12px; color:#666; margin-top:-5px;">※経費がある場合は、出面と一緒にそのまま入力して送信してください。</p>
                
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <div style="flex:1;"><label>ガソリン</label><input type="number" id="expGas" placeholder="例: 1000" style="margin-bottom:0;"></div>
                    <div style="flex:1;"><label>高速</label><input type="number" id="expHigh" placeholder="例: 800" style="margin-bottom:0;"></div>
                </div>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <div style="flex:1;"><label>駐車場</label><input type="number" id="expPark" placeholder="例: 500" style="margin-bottom:0;"></div>
                    <div style="flex:1;"><label>雑費</label><input type="number" id="expMisc" placeholder="例: 300" style="margin-bottom:0;"></div>
                </div>
            </div>

            <button type="submit" id="submitBtn" style="margin-bottom: 30px;">出面と経費を送信</button>
        </form>
    </div>

    <div id="view-calendar" class="view card">
        <h2>📅 出面・給与自動集計</h2>
        <label>集計する月を選択</label>
        <select id="calMonthSelect" style="font-weight: bold; color: #1a365d; background: #fff; border-color: #1a73e8;"></select>
        <button onclick="fetchCalendar(this)">指定した月で集計開始</button>
        <div id="calResult" style="display:none;">
            <div id="calDetails" style="margin-top:20px;"></div>
        </div>
    </div>

    <div id="view-settings" class="view card">
        <h2>🏢 会社・個人設定</h2>
        <div style="background: #fafafa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #ccc;">
            <label>会社名（自分が見分けるための名前）</label><input type="text" id="newCompName" placeholder="例: （株）現場革命">
            <label>招待コード（親方からもらったコード）</label>
            <input type="text" id="newInviteCode" placeholder="親方からLINE等で届いたコードを貼り付け" autocomplete="off" autocapitalize="off" spellcheck="false">

            <label>自分の暗証番号 (4桁)</label>
            <input type="password" id="mySecretPin" placeholder="親方が決めた4桁の数字" maxlength="4" inputmode="numeric" style="border-color:#e53935; background:#ffebee;">

            <p style="font-size:12px; color:#666; margin-top:-10px;">※日当・締め日・支払日は、親方が登録した内容が自動で使われます。</p>

            <button class="btn-gray" id="addCompanyBtn" onclick="addCompany(this)">この内容で会社を追加</button>
        </div>
        <h3>登録済みの会社一覧</h3>
        <div id="companyList"></div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="switchView('report', this)">📝 報告</button>
    <button class="tab-btn" onclick="switchView('calendar', this)">📅 集計・給料</button>
    <button class="tab-btn" onclick="switchView('settings', this)">⚙️ 設定変更</button>
</div>

    <script>
    const SUPABASE_URL = "https://gifwnwwxviasnsjqyyzr.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_Vhhe7TrF5XsP6vF_xOm_Kw_P2R0B5wi";

    // 🔐 子方アプリは親方のライセンスキーを一切持たない。
    //    招待コード＋自分の4桁PINで、Supabaseの関数（child_～）を通して自分の分だけ読み書きする。
    const baseHeaders = {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
    };

    // 💰 単価が未設定のときの最終フォールバック（親方画面と同じ値）
    const DEFAULT_WAGE = 15000;

    // 🛡️ HTMLエスケープ（会社名や現場名に " や < が入っても画面が壊れないようにする）
    function esc(v) {
        if (v === null || v === undefined) return '';
        return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 📡 Supabaseの関数を呼ぶ共通処理（エラー時は日本語のメッセージを投げる）
    async function rpc(name, params) {
        const res = await fetch(`${SUPABASE_URL}/rpc/${name}`, {
            method: 'POST',
            headers: baseHeaders,
            body: JSON.stringify(params)
        });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
        if (!res.ok) {
            const msg = (data && data.message) ? data.message : (text || ('通信エラー ' + res.status));
            throw new Error(msg);
        }
        return data;
    }

    function fmtDate(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // 🔢 空欄なら既定値、数字でなければ null を返す（0 はそのまま 0 として扱う）
    function readNumber(id, emptyValue) {
        const raw = document.getElementById(id).value.trim();
        if (raw === '') return emptyValue;
        const n = Number(raw);
        return Number.isFinite(n) ? n : null;
    }

    // 📦 保存データの読み込み（旧バージョンの「ライセンスキー入り」の登録は破棄する）
    let companies = [];
    let hadLegacyCompanies = false;
    (function loadCompanies() {
        let stored = [];
        try { stored = JSON.parse(localStorage.getItem('oreno_companies')) || []; } catch (e) { stored = []; }
        if (!Array.isArray(stored)) stored = [];
        companies = stored.filter(c => c && c.token && c.pin);
        if (companies.length !== stored.length) hadLegacyCompanies = true;
        // 旧データに入っていたライセンスキー(url)は端末から消す
        companies.forEach(c => { delete c.url; });
    })();
    let activeIndex = parseInt(localStorage.getItem('oreno_active_index')) || 0;
    if (activeIndex < 0 || activeIndex >= companies.length) activeIndex = 0;
    let currentSitesData = [];

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('workDate').value = fmtDate(new Date());

        // 日付・現場のいずれかが変わったら登録済みのデータを自動検索して表示する
        ['workDate', 'siteSelect'].forEach(id => {
            document.getElementById(id).addEventListener('change', loadExistingAttendanceForChild);
        });

        // 招待リンク（?invite=コード）で開かれたら、コード欄に自動で入れる
        const inviteParam = new URLSearchParams(location.search).get('invite');
        if (inviteParam) document.getElementById('newInviteCode').value = inviteParam.trim();

        if (hadLegacyCompanies) {
            saveData();
            alert('🔐 セキュリティ強化のため、登録方法が変わりました。\n親方から「招待コード」をもらって、設定タブから会社を登録し直してください。');
        }

        setupCalMonthSelect();
        renderCompanies();
        if (companies.length === 0 || inviteParam) {
            switchView('settings', document.querySelectorAll('.tab-btn')[2]);
        }
        if (companies.length > 0) loadMasters();
    });

    function setupCalMonthSelect() {
        const select = document.getElementById('calMonthSelect');
        if (!select) return;
        select.innerHTML = '';
        const today = new Date();
        for (let i = -1; i < 12; i++) {
            const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            select.innerHTML += `<option value="${yyyy}-${mm}">${yyyy}年${mm}月</option>`;
        }
        select.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
    }

    function switchView(viewName, btn) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + viewName).classList.add('active');
        btn.classList.add('active');
    }

    // 親方マスターの最新値（名前・日当・締め日など）を会社データに反映する
    function applyMaster(comp, m) {
        comp.myName = m.worker_name;
        comp.wage = Number(m.wage) || 0;
        comp.taxType = m.tax_type === '税別' ? '税別' : '税込';
        comp.closingDate = Number(m.closing) || 31;
        comp.payDate = m.pay_date || '未設定';
    }

    async function addCompany(btn) {
        const name = document.getElementById('newCompName').value.trim();
        const token = document.getElementById('newInviteCode').value.replace(/\s/g, '');
        const myPin = document.getElementById('mySecretPin').value.trim();

        if (!name || !token) return alert('会社名と招待コードを入力してください');
        if (!/^\d{4}$/.test(myPin)) return alert('自分の暗証番号（4桁の数字）を正しく入力してください');
        if (companies.some(c => c.token === token)) return alert('この招待コードはすでに登録されています');

        btn.disabled = true;
        const originalText = btn.innerText;
        btn.innerText = '確認中...';
        try {
            const rows = await rpc('child_login', { p_token: token, p_pin: myPin });
            if (!Array.isArray(rows) || rows.length === 0) throw new Error('登録情報が見つかりません');

            const comp = { name, token, pin: myPin };
            applyMaster(comp, rows[0]);
            companies.push(comp);
            if (companies.length === 1) activeIndex = 0;
            saveData();

            document.getElementById('newCompName').value = '';
            document.getElementById('newInviteCode').value = '';
            document.getElementById('mySecretPin').value = '';

            renderCompanies();
            if (companies.length === 1) loadMasters();
            alert(`✅ 登録しました！\n報告者: ${comp.myName}`);
        } catch (err) {
            alert('❌ 登録できませんでした。\n' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = originalText;
        }
    }

    function renderCompanies() {
        const list = document.getElementById('companyList');
        list.innerHTML = '';
        companies.forEach((comp, idx) => {
            const isActive = idx == activeIndex;
            const wageText = comp.wage ? `¥${Number(comp.wage).toLocaleString()} (${esc(comp.taxType)})` : '未設定';
            const closeText = comp.closingDate == 31 ? '月末' : esc(comp.closingDate) + '日';

            list.innerHTML += `
                <div class="company-item" style="${isActive ? 'border-color: #1a73e8; background: #e3f2fd;' : ''}">
                    <div style="font-weight:bold; font-size:18px;">${esc(comp.name)}</div>
                    <div style="font-size:14px; color:#555; margin-top:5px;">👤 登録名: ${esc(comp.myName)}</div>
                    <div style="font-size:12px; color:#666; margin-top:5px; background:#fff; padding:6px; border-radius:4px; border:1px solid #ccc;">
                        💰 単価: <b>${wageText}</b> / 🗓 締め: <b>${closeText}</b> / 💸 支払: <b>${esc(comp.payDate)}</b>
                    </div>
                    <div style="margin-top:10px;">
                        ${isActive ? '✅ 現在の送信先' : `<button class="btn-gray" style="padding:8px; font-size:14px; width:48%;" onclick="setActiveCompany(${idx})">これに切替</button>`}
                        <button class="btn-red" style="padding:8px; font-size:14px; width:48%; float:right;" onclick="deleteCompany(${idx})">削除</button>
                    </div>
                    <div style="clear:both;"></div>
                </div>
            `;
        });

        const current = companies[activeIndex];
        if (current) {
            document.getElementById('headerCompanyName').innerText = `🏢 送信先：${current.name}`;
            document.getElementById('reportUserBadge').innerText = `👤 報告者: ${current.myName}`;
        } else {
            document.getElementById('headerCompanyName').innerText = '🏢 送信先未設定 (設定タブへ)';
            document.getElementById('reportUserBadge').innerText = '👤 報告者: 未設定';
        }
    }

    function setActiveCompany(idx) {
        activeIndex = idx;
        saveData();
        renderCompanies();
        loadMasters();
        alert('送信先を切り替えました！');
    }

    function deleteCompany(idx) {
        if (!confirm('本当に削除しますか？')) return;
        companies.splice(idx, 1);
        // 削除で番号がズレて、別の会社に送信されてしまうのを防ぐ
        if (idx === activeIndex) {
            activeIndex = 0;
        } else if (idx < activeIndex) {
            activeIndex = activeIndex - 1;
        }
        if (activeIndex < 0 || activeIndex >= companies.length) activeIndex = 0;
        saveData();
        renderCompanies();
        loadMasters();
    }

    function saveData() {
        localStorage.setItem('oreno_companies', JSON.stringify(companies));
        localStorage.setItem('oreno_active_index', activeIndex);
    }

    // 現場一覧と、自分の最新マスター情報（名前・日当など）を読み込む
    async function loadMasters() {
        const sel = document.getElementById('siteSelect');
        const comp = companies[activeIndex];
        if (!comp) {
            currentSitesData = [];
            sel.innerHTML = '<option value="" disabled selected>現場を選択してください</option>';
            return;
        }
        try {
            const [sites, me] = await Promise.all([
                rpc('child_list_sites', { p_token: comp.token, p_pin: comp.pin }),
                rpc('child_login', { p_token: comp.token, p_pin: comp.pin })
            ]);
            if (Array.isArray(me) && me.length > 0) {
                applyMaster(comp, me[0]);
                saveData();
                renderCompanies();
            }
            currentSitesData = Array.isArray(sites) ? sites : [];
            sel.innerHTML = '<option value="" disabled selected>現場を選択してください</option>';
            currentSitesData.forEach(s => {
                sel.innerHTML += `<option value="${esc(s.site_name)}">${esc(s.site_name)}</option>`;
            });
        } catch (err) {
            console.log('現場マスター読込失敗', err);
            alert('⚠️ 現場の読み込みに失敗しました。\n' + err.message + '\n\n暗証番号や招待コードが変わった場合は、設定タブで登録し直してください。');
        }
    }

    function syncClientCompany() {
        const siteName = document.getElementById('siteSelect').value;
        const siteInfo = currentSitesData.find(s => s.site_name === siteName);
        document.getElementById('clientCompany').value = (siteInfo && siteInfo.client_company) ? siteInfo.client_company : '';
    }

    function resetReportFields() {
        document.getElementById('headcount').value = 1;
        document.getElementById('others').value = '';
        document.getElementById('expGas').value = '';
        document.getElementById('expHigh').value = '';
        document.getElementById('expPark').value = '';
        document.getElementById('expMisc').value = '';
        document.getElementById('halfDayCheck').checked = false;
    }

    // 既に登録済みのデータがあれば画面に自動表示する
    async function loadExistingAttendanceForChild() {
        const comp = companies[activeIndex];
        if (!comp) return;

        const workDateVal = document.getElementById('workDate').value;
        const siteNameVal = document.getElementById('siteSelect').value;
        if (!workDateVal || !siteNameVal) return;

        try {
            const rows = await rpc('child_get_attendance', {
                p_token: comp.token, p_pin: comp.pin,
                p_work_date: workDateVal, p_site_name: siteNameVal
            });
            if (Array.isArray(rows) && rows.length > 0) {
                const record = rows[0];
                // headcount が 0（経費のみの登録など）の場合もあるため、そのまま値を引き継ぐ
                document.getElementById('headcount').value = (record.headcount === null || record.headcount === undefined) ? 1 : record.headcount;
                document.getElementById('clientCompany').value = record.client_company || '';
                document.getElementById('others').value = record.others || '';
                document.getElementById('expGas').value = record.gasoline || 0;
                document.getElementById('expHigh').value = record.highway || 0;
                document.getElementById('expPark').value = record.parking || 0;
                document.getElementById('expMisc').value = record.misc || 0;
                // 上書き時に重複して半分になるのを防ぐため、半日チェックは外す
                document.getElementById('halfDayCheck').checked = false;
            } else {
                resetReportFields();
                syncClientCompany();
            }
        } catch (err) {
            console.error('既存データの自動取得に失敗しました:', err);
        }
    }

    async function submitAttendance(e) {
        e.preventDefault();
        const comp = companies[activeIndex];
        if (!comp) return alert('設定タブで会社を登録してください');
        if (companies.length >= 2 && !confirm(`送信先は【 ${comp.name} 】\n報告者は【 ${comp.myName} 】で間違いありませんか？`)) return;

        const workDateVal = document.getElementById('workDate').value;
        const siteNameVal = document.getElementById('siteSelect').value;
        if (!workDateVal || !siteNameVal) return alert('作業日と現場を選んでください');

        // 人数：空欄なら1、0（経費のみ）はそのまま0で登録する
        let finalHeadcount = readNumber('headcount', 1);
        if (finalHeadcount === null || finalHeadcount < 0) return alert('人数を正しく入力してください');

        const expenseIds = ['expGas', 'expHigh', 'expPark', 'expMisc'];
        const expenses = expenseIds.map(id => readNumber(id, 0));
        if (expenses.some(v => v === null || v < 0)) return alert('経費は0以上の数字で入力してください');

        const isHalfDay = document.getElementById('halfDayCheck').checked;
        if (isHalfDay) {
            const calculatedHalf = finalHeadcount * 0.5;
            if (!confirm(`⚠️ 半日チェックが入っています。\n\n人工を半分にして【 ${calculatedHalf} 人工 】で登録しますがよろしいですか？`)) return;
            finalHeadcount = calculatedHalf;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 送信中...';

        try {
            const result = await rpc('child_submit_attendance', {
                p_token: comp.token,
                p_pin: comp.pin,
                p_work_date: workDateVal,
                p_site_name: siteNameVal,
                p_headcount: finalHeadcount,
                p_others: document.getElementById('others').value || '',
                p_gasoline: Math.round(expenses[0]),
                p_highway: Math.round(expenses[1]),
                p_parking: Math.round(expenses[2]),
                p_misc: Math.round(expenses[3])
            });

            alert(result === 'updated' ? '正常に記録（上書き）しました！' : '正常に記録しました！');

            document.getElementById('siteSelect').value = '';
            document.getElementById('clientCompany').value = '';
            resetReportFields();
        } catch (err) {
            alert('❌ 送信できませんでした。\n' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = '出面と経費を送信';
        }
    }

    // 📅 出勤カレンダー（選んだ月の1日〜月末。締め日が月末以外なら、給料の対象期間を枠で囲む）
    let calStore = {};   // { 会社番号: { 'YYYY-MM-DD': [出面...] } }

    function buildWorkCalendar(ci, year, month, records, closing, startStr, endStr) {
        const prefix = `${year}-${String(month).padStart(2, '0')}`;
        const byDay = {};
        records.forEach(r => {
            const d = r.work_date || '';
            if (!d.startsWith(prefix)) return;
            (byDay[d] = byDay[d] || []).push(r);
        });
        calStore[ci] = byDay;

        const hcOf = r => (r.headcount === null || r.headcount === undefined) ? 1 : Number(r.headcount);
        const first = new Date(year, month - 1, 1);
        const lastDay = new Date(year, month, 0).getDate();
        const wds = ['日', '月', '火', '水', '木', '金', '土'];
        let cells = wds.map((w, i) => `<div class="wcal-wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
        for (let i = 0; i < first.getDay(); i++) cells += '<div class="wcal-day empty"></div>';

        let workDays = 0;
        for (let day = 1; day <= lastDay; day++) {
            const ds = `${prefix}-${String(day).padStart(2, '0')}`;
            const wd = new Date(year, month - 1, day).getDay();
            const recs = byDay[ds] || [];
            const total = recs.reduce((s, r) => s + hcOf(r), 0);
            const inPeriod = closing !== 31 && ds >= startStr && ds <= endStr;
            let mark = '';
            if (recs.length > 0) {
                if (total >= 1) { mark = `<span class="wcal-mark full">${total === 1 ? '' : total}</span>`; workDays++; }
                else if (total > 0) { mark = `<span class="wcal-mark half">½</span>`; workDays++; }
                else mark = `<span class="wcal-mark zero">¥</span>`;
            }
            const cls = ['wcal-day', wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', inPeriod ? 'in-period' : '', recs.length ? 'has' : ''].join(' ');
            cells += recs.length
                ? `<div class="${cls}" role="button" tabindex="0" data-ci="${ci}" data-date="${ds}" aria-label="${month}月${day}日の出面を見る"><span class="wcal-num">${day}</span>${mark}</div>`
                : `<div class="${cls}"><span class="wcal-num">${day}</span></div>`;
        }

        // 締め日が月末以外：前月から給料に入っている分を1行で出す
        let note = '';
        if (closing !== 31) {
            const prevRecs = records.filter(r => r.work_date >= startStr && r.work_date < `${prefix}-01`);
            const prevDays = prevRecs.reduce((s, r) => s + hcOf(r), 0);
            const [, sm, sd] = startStr.split('-').map(Number);
            const prevEnd = new Date(year, month - 1, 0);
            note = `<div class="wcal-note">前月 ${sm}/${sd}〜${prevEnd.getMonth() + 1}/${prevEnd.getDate()} の分：<b>${prevDays}</b> 人工（今回の給料に入っています）</div>`;
        }

        return `
            <div class="wcal">
                <div class="wcal-title">📅 ${month}月の出勤カレンダー（${workDays}日出勤）</div>
                <div class="wcal-grid">${cells}</div>
                <div class="wcal-legend">
                    <span><span class="wcal-mark full"></span>1日</span>
                    <span><span class="wcal-mark half">½</span>半日</span>
                    <span><span class="wcal-mark zero">¥</span>経費のみ</span>
                    ${closing !== 31 ? '<span><span class="box"></span>今回の給料の対象</span>' : ''}
                </div>
                ${note}
                <div class="wcal-detail" id="wcalDetail_${ci}"></div>
                <div style="font-size:11px; color:#888; margin-top:6px;">※印のついた日を押すと、その日の現場と経費が出ます</div>
            </div>`;
    }

    // 日付を押したら、その日の中身を下に出す
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('.wcal-day.has');
        if (!btn) return;
        const ci = btn.dataset.ci, ds = btn.dataset.date;
        const recs = (calStore[ci] || {})[ds] || [];
        btn.closest('.wcal').querySelectorAll('.wcal-day.selected').forEach(el => el.classList.remove('selected'));
        btn.classList.add('selected');
        const [, m, d] = ds.split('-').map(Number);
        const lines = recs.map(r => {
            const hc = (r.headcount === null || r.headcount === undefined) ? 1 : Number(r.headcount);
            const parts = [['ガソリン', r.gasoline], ['高速', r.highway], ['駐車場', r.parking], ['雑費', r.misc]]
                .filter(([, v]) => Number(v) > 0).map(([k, v]) => `${k} ¥${Number(v).toLocaleString()}`);
            return `🏢 <b>${esc(r.site_name)}</b>　${hc === 0 ? '経費のみ' : hc + '人工'}${parts.length ? `<br><span style="color:#059669;">💰 ${parts.join(' / ')}</span>` : ''}`;
        });
        document.getElementById('wcalDetail_' + ci).innerHTML = `<div style="font-weight:bold; margin-bottom:2px;">${m}月${d}日</div>${lines.join('<hr style="border:0; border-top:1px dashed #cfe0fb; margin:4px 0;">')}`;
    });

    async function fetchCalendar(btn) {
        if (companies.length === 0) return alert('会社が登録されていません');
        const selectedMonthPrefix = document.getElementById('calMonthSelect').value;
        const [targetYear, targetMonth] = selectedMonthPrefix.split('-').map(Number);
        let detailsHtml = '';

        document.getElementById('calResult').style.display = 'block';
        document.getElementById('calDetails').innerHTML = `<div style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> データを収集中...</div>`;

        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 集計中...';

        // 取得範囲：前月1日〜選択月の末日（締め日がずれても必ず含まれる）
        const fetchFrom = fmtDate(new Date(targetYear, targetMonth - 2, 1));
        const fetchTo = fmtDate(new Date(targetYear, targetMonth, 0));

        try {
            calStore = {};
            for (const [ci, comp] of companies.entries()) {
                try {
                    // 親方マスターの最新の日当・締め日・税区分を使う（親方画面と同じ計算にする）
                    const [me, attRecords] = await Promise.all([
                        rpc('child_login', { p_token: comp.token, p_pin: comp.pin }),
                        rpc('child_list_attendance', { p_token: comp.token, p_pin: comp.pin, p_from: fetchFrom, p_to: fetchTo })
                    ]);
                    if (Array.isArray(me) && me.length > 0) applyMaster(comp, me[0]);

                    const masterWage = Number(comp.wage) || 0;
                    const closing = Number(comp.closingDate) || 31;
                    const isTaxExc = comp.taxType === '税別';

                    let startPeriod, endPeriod, displayPeriodText;
                    if (closing !== 31) {
                        startPeriod = new Date(targetYear, targetMonth - 2, closing + 1);
                        endPeriod = new Date(targetYear, targetMonth - 1, closing);
                        displayPeriodText = `${startPeriod.getMonth() + 1}/${startPeriod.getDate()} 〜 ${endPeriod.getMonth() + 1}/${endPeriod.getDate()}`;
                    }
                    const startStr = startPeriod ? fmtDate(startPeriod) : null;
                    const endStr = endPeriod ? fmtDate(endPeriod) : null;

                    // 1行ごとに親方画面と同じ計算をする（単価：出面の単価→マスター単価→既定値、税は行ごとに切り捨て）
                    const emptySum = () => ({ days: 0, wageTotal: 0, tax: 0, expenses: 0 });
                    const std = emptySum(), cls = emptySum();
                    const addRow = (sum, r) => {
                        const hc = (r.headcount === null || r.headcount === undefined) ? 1 : Number(r.headcount);
                        const unit = Number(r.wage) ? Number(r.wage) : (masterWage || DEFAULT_WAGE);
                        const base = unit * hc;
                        const tax = isTaxExc ? Math.floor(base * 0.1) : 0;
                        const exp = (Number(r.gasoline) || 0) + (Number(r.highway) || 0) + (Number(r.parking) || 0) + (Number(r.misc) || 0);
                        sum.days += hc;
                        sum.wageTotal += base + tax;
                        sum.tax += tax;
                        sum.expenses += exp;
                    };

                    (Array.isArray(attRecords) ? attRecords : []).forEach(r => {
                        const d = r.work_date || '';
                        if (d.startsWith(selectedMonthPrefix)) addRow(std, r);
                        if (closing === 31) {
                            if (d.startsWith(selectedMonthPrefix)) addRow(cls, r);
                        } else if (d >= startStr && d <= endStr) {
                            addRow(cls, r);
                        }
                    });

                    const unitText = `@${(masterWage || DEFAULT_WAGE).toLocaleString()}`;
                    const block = (sum) => `
                                合計人工: <b>${sum.days}</b> 人<br>
                                予想給与: <span class="wage-highlight" style="COLOR_PLACEHOLDER">¥${(sum.wageTotal + sum.expenses).toLocaleString()}</span>
                                <div style="font-size:11px; color:#718096; margin-top:2px;">
                                    (${unitText} ${isTaxExc ? `/ 消費税: ¥${sum.tax.toLocaleString()}` : ''} ${sum.expenses > 0 ? `<br><span style="color:#059669;">💰 経費合計: ¥${sum.expenses.toLocaleString()}</span>` : ''})
                                </div>`;

                    detailsHtml += `
                        <div style="background:#fff; border:1px solid #ccc; border-radius:8px; padding:15px; margin-bottom:20px;">
                            <h3 style="margin-top:0; color:#1a365d;">🏢 ${esc(comp.name)}</h3>
                            <div class="cal-summary" style="background:#f5f5f5; border-color:#ddd;">
                                <span class="period-label" style="background:#757575;">月単位 (1日〜月末)</span><br>
                                ${block(std).replace('COLOR_PLACEHOLDER', 'color:#555;')}
                            </div>
                            <div class="cal-summary">
                                <span class="period-label">実際の給与対象 (${closing == 31 ? '月末' : closing + '日'}締め)</span><br>
                                ${closing !== 31 ? `<span style="font-size:12px; color:#555;">期間: ${displayPeriodText}</span><br>` : ''}
                                ${block(cls).replace('COLOR_PLACEHOLDER', '')}
                                <div style="font-size:12px; color:#1a73e8; margin-top:8px;">💳 支払日: ${esc(comp.payDate)}</div>
                            </div>
                            ${buildWorkCalendar(ci, targetYear, targetMonth, Array.isArray(attRecords) ? attRecords : [], closing, startStr, endStr)}
                        </div>
                    `;
                } catch (e) {
                    console.log(comp.name + 'の取得失敗', e);
                    detailsHtml += `<div style="background:#fff5f5; border:1px solid #fc8181; border-radius:8px; padding:12px; margin-bottom:20px; color:#c53030; font-size:13px;">🏢 ${esc(comp.name)}：取得に失敗しました（${esc(e.message)}）</div>`;
                }
            }
            saveData();
            renderCompanies();
            document.getElementById('calDetails').innerHTML = detailsHtml || `<p style="text-align:center;">⚠️ データがありません</p>`;
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    // ⌨️ カレンダーの日付はキーボード（Enter/スペース）でも選べるようにする
    document.addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('wcal-day') && e.target.classList.contains('has')) {
            e.preventDefault(); e.target.click();
        }
    });

    // 📱 iPhone（ホーム画面から開いたとき）対策：別のアプリから戻ると、下のタブや上のヘッダーが
    //    画面の途中に来てしまうことがある。離れるときに入力中の欄を閉じ、戻ったときに位置を計算し直す。
    (function () {
        const bars = () => document.querySelectorAll('.tab-bar, .bottom-nav, .header');
        function relayout() {
            bars().forEach(el => { el.style.transform = 'translateZ(0)'; });
            void document.body.offsetHeight;
            requestAnimationFrame(() => {
                bars().forEach(el => { el.style.transform = ''; });
                window.scrollTo(window.scrollX, window.scrollY);
            });
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                // キーボードが出たまま離れると、戻ったときに画面の高さがずれるので先に閉じる
                const a = document.activeElement;
                if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) a.blur();
            } else {
                relayout(); setTimeout(relayout, 300); setTimeout(relayout, 1000);
            }
        });
        window.addEventListener('pageshow', relayout);
        window.addEventListener('focus', relayout);
        window.addEventListener('orientationchange', () => setTimeout(relayout, 300));
        if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
    })();
</script>
</body>
